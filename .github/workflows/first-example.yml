name: My first Workflow

on: push

jobs:
    first-job: 
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: List and Read contents of the repo
              run: |
                echo "My first GitHub Action workflow"
                ls -lrta
                cat README.md

            - name: Generate ASCII artwork
              run: cowsay -f dragon "I'm Smaug! *Bellows fire* " >> dragon.txt
              